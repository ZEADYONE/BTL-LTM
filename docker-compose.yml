# MySQL is not part of this stack: the server connects to an existing database
# server configured by BOMBERMAN_DB_HOST/PORT/NAME in .env.
services:
  server:
    image: bomberman-server:${BOMBERMAN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    # Lets BOMBERMAN_DB_HOST=host.docker.internal reach a MySQL running on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BOMBERMAN_TCP_PORT: "8081"
      BOMBERMAN_DB_URL: "jdbc:mysql://${BOMBERMAN_DB_HOST:?Set BOMBERMAN_DB_HOST in .env to the database server host/IP}:${BOMBERMAN_DB_PORT:-3306}/${BOMBERMAN_DB_NAME:-bomberman_online}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      BOMBERMAN_DB_USERNAME: ${BOMBERMAN_DB_USERNAME:-bomberman}
      BOMBERMAN_DB_PASSWORD: ${BOMBERMAN_DB_PASSWORD:?Copy env.template to .env and set BOMBERMAN_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: ${BOMBERMAN_JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}
    ports:
      - "${BOMBERMAN_TCP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "awk '$$2 ~ /:1F91$$/ && $$4 == \"0A\" { found=1 } END { exit found ? 0 : 1 }' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s

  # Landing page + client download. Deliberately not depends_on server: the download
  # page must stay reachable while the game server is down.
  website:
    image: bomberman-website:${BOMBERMAN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: website/Dockerfile
    restart: unless-stopped
    environment:
      BOMBERMAN_PUBLIC_HOST: ${BOMBERMAN_PUBLIC_HOST:-}
      BOMBERMAN_PUBLIC_PORT: ${BOMBERMAN_PUBLIC_PORT:-${BOMBERMAN_TCP_PORT:-8081}}
      BOMBERMAN_REPO_URL: ${BOMBERMAN_REPO_URL:-}
    ports:
      - "${BOMBERMAN_WEB_PORT:-80}:80"
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
