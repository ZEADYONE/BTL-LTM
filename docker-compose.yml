services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${BOMBERMAN_DB_NAME:-bomberman_online}
      MYSQL_USER: ${BOMBERMAN_DB_USERNAME:-bomberman}
      MYSQL_PASSWORD: ${BOMBERMAN_DB_PASSWORD:?Copy env.template to .env and set BOMBERMAN_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${BOMBERMAN_DB_ROOT_PASSWORD:?Copy env.template to .env and set BOMBERMAN_DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${BOMBERMAN_DB_PORT:-3306}:3306"
    volumes:
      - bomberman_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  server:
    image: bomberman-server:${BOMBERMAN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      BOMBERMAN_TCP_PORT: "8081"
      BOMBERMAN_DB_URL: "jdbc:mysql://mysql:3306/${BOMBERMAN_DB_NAME:-bomberman_online}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      BOMBERMAN_DB_USERNAME: ${BOMBERMAN_DB_USERNAME:-bomberman}
      BOMBERMAN_DB_PASSWORD: ${BOMBERMAN_DB_PASSWORD:?Copy env.template to .env and set BOMBERMAN_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: ${BOMBERMAN_JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}
    ports:
      - "${BOMBERMAN_TCP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "awk '$$2 ~ /:1F91$$/ && $$4 == \"0A\" { found=1 } END { exit found ? 0 : 1 }' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s

  # Landing page + client download. Deliberately not depends_on server: the download
  # page must stay reachable while the game server is down.
  website:
    image: bomberman-website:${BOMBERMAN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: website/Dockerfile
    restart: unless-stopped
    environment:
      BOMBERMAN_PUBLIC_HOST: ${BOMBERMAN_PUBLIC_HOST:-}
      BOMBERMAN_PUBLIC_PORT: ${BOMBERMAN_PUBLIC_PORT:-${BOMBERMAN_TCP_PORT:-8081}}
      BOMBERMAN_REPO_URL: ${BOMBERMAN_REPO_URL:-}
    ports:
      - "${BOMBERMAN_WEB_PORT:-80}:80"
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  bomberman_mysql_data:
