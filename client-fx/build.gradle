plugins {
    id 'application'
}

ext {
    javafxVersion = '21.0.12'
}

// JavaFX ships one jar per operating system; the POMs select it through Maven profiles,
// which Gradle ignores, so every module is declared with an explicit classifier.
def osName = System.getProperty('os.name').toLowerCase()
def osArch = System.getProperty('os.arch').toLowerCase()
def javafxPlatform = osName.contains('win') ? 'win'
        : osName.contains('mac') ? (osArch.contains('aarch64') ? 'mac-aarch64' : 'mac')
        : (osArch.contains('aarch64') ? 'linux-aarch64' : 'linux')

dependencies {
    implementation project(':common')
    ['base', 'graphics', 'controls'].each { module ->
        implementation "org.openjfx:javafx-${module}:${javafxVersion}:${javafxPlatform}"
    }
    implementation 'com.github.weisj:jsvg:2.2.0'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.4.0'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.4.0'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.bomberman.clientfx.Launcher'
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}
