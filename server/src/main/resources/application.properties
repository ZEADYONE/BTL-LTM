spring.application.name=bomberman-server
bomberman.tcp.port=${BOMBERMAN_TCP_PORT:8081}

spring.datasource.url=${BOMBERMAN_DB_URL:jdbc:mysql://localhost:3306/bomberman_online?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${BOMBERMAN_DB_USERNAME:root}
spring.datasource.password=${BOMBERMAN_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
